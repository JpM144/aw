<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Foro en vivo</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --favor: #059669; --favor-soft: #d1fae5; --contra: #dc2626; --contra-soft: #fee2e2;
    --accent: #2563eb; --hand: #f59e0b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0f17; --card: #151b26; --text: #f3f4f6; --muted: #9ca3af; --line: #263041;
      --favor-soft: #06352a; --contra-soft: #3b1414; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 4px 0 16px; text-align: center; }
  .card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  input { width: 100%; font-size: 18px; padding: 14px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--bg); color: var(--text); outline: none; }
  input:focus { border-color: var(--accent); }
  button { font: inherit; border: 0; border-radius: 14px; cursor: pointer; font-weight: 700; }
  .btn-main { width: 100%; padding: 16px; font-size: 18px; background: var(--accent); color: #fff; margin-top: 12px; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 14px; }

  /* Orador */
  .orador { text-align: center; padding: 20px 16px; transition: background .3s; }
  .orador.libre { background: var(--card); }
  .orador.favor { background: var(--favor); color: #fff; }
  .orador.contra { background: var(--contra); color: #fff; }
  .orador .etq { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
  .orador .nombre { font-size: 28px; font-weight: 800; margin: 6px 0; word-break: break-word; }
  .reloj { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .barra { height: 8px; border-radius: 99px; background: rgba(255,255,255,.3); overflow: hidden; margin-top: 10px; }
  .barra > div { height: 100%; background: #fff; width: 100%; }

  /* Mano */
  .btn-mano { width: 100%; padding: 22px; font-size: 22px; background: var(--hand); color: #111; }
  .btn-mano:disabled { opacity: .45; cursor: not-allowed; }
  .btn-ceder { width: 100%; padding: 12px; margin-top: 10px; background: transparent; color: var(--muted);
    border: 2px solid var(--line); }

  /* Elegir lado */
  .lados { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .lado { padding: 16px 8px; font-size: 17px; border: 3px solid transparent; }
  .lado.favor { background: var(--favor-soft); color: var(--favor); }
  .lado.contra { background: var(--contra-soft); color: var(--contra); }
  .lado.activo.favor { background: var(--favor); color: #fff; border-color: var(--favor); }
  .lado.activo.contra { background: var(--contra); color: #fff; border-color: var(--contra); }

  /* Grupos */
  .grupos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grupo h3 { margin: 0 0 8px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .grupo.favor h3 { color: var(--favor); } .grupo.contra h3 { color: var(--contra); }
  .cuenta { font-size: 22px; }
  .medidor { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--line); margin: 4px 0 14px; }
  .medidor .f { background: var(--favor); transition: width .4s; } .medidor .c { background: var(--contra); transition: width .4s; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 7px 10px; border-radius: 10px; margin-bottom: 5px; font-size: 15px; background: var(--bg);
    word-break: break-word; display: flex; align-items: center; gap: 6px; }
  li.yo { outline: 2px solid var(--accent); }
  li.off { opacity: .45; }
  li.habla { background: var(--hand); color: #111; font-weight: 700; }
  .sinlado { margin-top: 10px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff;
    padding: 12px 18px; border-radius: 12px; font-size: 15px; max-width: 90%; text-align: center; z-index: 9; }
  .estado-con { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .salir { background: none; color: var(--muted); font-weight: 500; text-decoration: underline; padding: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🗣️ Foro en vivo</h1>

  <!-- Pantalla de ingreso -->
  <section id="ingreso" class="card hidden">
    <label for="nombre" class="muted">¿Cómo te llamas?</label>
    <input id="nombre" maxlength="30" autocomplete="name" placeholder="Tu nombre" style="margin-top:8px">
    <button id="entrar" class="btn-main">Entrar al foro</button>
  </section>

  <!-- Pantalla principal -->
  <section id="foro" class="hidden">
    <div id="orador" class="card orador libre">
      <div class="etq" id="oEtq">Nadie tiene la palabra</div>
      <div class="nombre" id="oNombre">✋ La palabra está libre</div>
      <div id="oReloj" class="hidden">
        <div class="reloj" id="oSeg">20</div>
        <div class="barra"><div id="oBarra"></div></div>
      </div>
    </div>

    <div class="card">
      <button id="mano" class="btn-mano">✋ Alzar la mano</button>
      <button id="ceder" class="btn-ceder hidden">Terminé, ceder la palabra</button>
    </div>

    <div class="card">
      <div class="muted" style="margin-bottom:8px">Tu postura:</div>
      <div class="lados">
        <button class="lado favor" data-lado="favor">👍 A favor</button>
        <button class="lado contra" data-lado="contra">👎 En contra</button>
      </div>
    </div>

    <div class="card">
      <div class="medidor"><div class="f" id="mF" style="width:50%"></div><div class="c" id="mC" style="width:50%"></div></div>
      <div class="grupos">
        <div class="grupo favor"><h3>A favor <span class="cuenta" id="nF">0</span></h3><ul id="lF"></ul></div>
        <div class="grupo contra"><h3>En contra <span class="cuenta" id="nC">0</span></h3><ul id="lC"></ul></div>
      </div>
      <div class="sinlado muted" id="sinLado"></div>
    </div>

    <div style="text-align:center">
      <button class="salir" id="cambiarNombre">Cambiar nombre</button>
      <div class="estado-con" id="con">Conectando…</div>
    </div>
  </section>
</div>

<script src="vendor/mqtt.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const TURNO_MS = 20000;
  const EXPIRA_MS = 75000;   // si no hay señal de alguien en 75 s, se quita de la lista
  const LATIDO_MS = 25000;
  const qs = new URLSearchParams(location.search);
  const SALA = (qs.get('sala') || 'principal').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 40) || 'principal';
  const BASE = 'foroenvivo/v1/' + SALA + '/';
  const BROKERS = qs.get('broker') ? [qs.get('broker')] : [
    'wss://broker.emqx.io:8084/mqtt',
    'wss://broker.hivemq.com:8884/mqtt',
    'wss://test.mosquitto.org:8081/mqtt',
  ];

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const nuevoId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12));

  let miId = store.get('foroId');
  if (!miId) { miId = nuevoId(); store.set('foroId', miId); }
  let miNombre = store.get('foroNombre') || '';
  let miLado = store.get('foroLado') || null;
  const gente = new Map();   // id -> { id, nombre, lado, visto }
  let orador = null;         // { id, nombre, lado, inicio, dur }
  let desfase = 0;           // reloj del servidor web - reloj local (corrige celulares con hora mal)
  let cliente = null, idxBroker = 0, conectado = false;

  const ahora = () => Date.now() + desfase;
  const oradorActivo = () => orador && ahora() < orador.inicio + orador.dur ? orador : null;

  // Sincronizar reloj con la hora del servidor de GitHub Pages
  fetch(location.href, { method: 'HEAD', cache: 'no-store' }).then((r) => {
    const d = Date.parse(r.headers.get('Date'));
    if (d) desfase = d + 500 - Date.now();
    if (Math.abs(desfase) < 1500) desfase = 0;
  }).catch(() => {});

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
  }

  function publicar(sub, obj, retener = true) {
    if (!cliente || !conectado) { toast('Sin conexión, reintentando…'); return false; }
    cliente.publish(BASE + sub, obj ? JSON.stringify(obj) : '', { qos: 1, retain: retener });
    return true;
  }
  function anunciarme() {
    if (!miNombre) return;
    const yo = { id: miId, nombre: miNombre, lado: miLado };
    publicar('p/' + miId, yo);
    gente.set(miId, { ...yo, visto: Date.now() });
    render();
  }

  function conectar() {
    if (cliente) { try { cliente.end(true); } catch {} }
    const url = BROKERS[idxBroker % BROKERS.length];
    $('con').textContent = '🟠 Conectando…';
    cliente = mqtt.connect(url, {
      clientId: 'foro_' + miId.replace(/-/g, '').slice(0, 16) + '_' + Math.random().toString(16).slice(2, 6),
      clean: true, keepalive: 20, reconnectPeriod: 2000, connectTimeout: 8000,
      will: { topic: BASE + 'p/' + miId, payload: '', qos: 1, retain: true },
    });
    let fallos = 0;
    cliente.on('connect', () => {
      conectado = true; fallos = 0;
      $('con').textContent = '🟢 Conectado en tiempo real · sala "' + SALA + '"';
      cliente.subscribe(BASE + '#', { qos: 1 });
      anunciarme();
    });
    cliente.on('close', () => {
      conectado = false;
      $('con').textContent = '🟠 Reconectando…';
      if (++fallos >= 3 && BROKERS.length > 1) { idxBroker++; setTimeout(conectar, 300); }
    });
    cliente.on('message', (topic, payload) => {
      const sub = topic.slice(BASE.length);
      const txt = payload.toString();
      let d = null;
      try { d = txt ? JSON.parse(txt) : null; } catch { return; }
      if (sub.startsWith('p/')) {
        const id = sub.slice(2);
        if (!d) { if (id !== miId) gente.delete(id); else anunciarme(); }
        else if (typeof d.nombre === 'string') {
          gente.set(id, { id, nombre: d.nombre.slice(0, 30), lado: d.lado === 'favor' || d.lado === 'contra' ? d.lado : null, visto: Date.now() });
        }
      } else if (sub === 'orador') {
        const antes = oradorActivo();
        orador = d && typeof d.nombre === 'string' && d.inicio ? { ...d, dur: Math.min(d.dur || TURNO_MS, TURNO_MS) } : null;
        const nuevo = oradorActivo();
        if (nuevo && (!antes || antes.id !== nuevo.id) && navigator.vibrate) navigator.vibrate([60, 40, 60]);
      }
      render();
    });
  }

  function mostrar(pantalla) {
    $('ingreso').classList.toggle('hidden', pantalla !== 'ingreso');
    $('foro').classList.toggle('hidden', pantalla !== 'foro');
  }

  function entrar() {
    const n = $('nombre').value.trim().slice(0, 30);
    if (!n) { toast('Escribe tu nombre'); return; }
    miNombre = n; store.set('foroNombre', n);
    anunciarme();
    mostrar('foro');
  }

  $('entrar').onclick = entrar;
  $('nombre').addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });
  $('cambiarNombre').onclick = () => { $('nombre').value = miNombre; mostrar('ingreso'); $('nombre').focus(); };
  document.querySelectorAll('.lado').forEach((b) => b.onclick = () => {
    miLado = b.dataset.lado; store.set('foroLado', miLado);
    const o = oradorActivo();
    if (o && o.id === miId) publicar('orador', { ...o, lado: miLado });
    anunciarme();
  });
  $('mano').onclick = () => {
    if (!miLado) return toast('Elige primero: A favor o En contra');
    const o = oradorActivo();
    if (o) return toast(o.nombre + ' tiene la palabra');
    if (navigator.vibrate) navigator.vibrate(30);
    publicar('orador', { id: miId, nombre: miNombre, lado: miLado, inicio: ahora(), dur: TURNO_MS });
  };
  $('ceder').onclick = () => {
    const o = oradorActivo();
    if (o && o.id === miId) publicar('orador', null);
  };

  function li(p, oradorId) {
    const el = document.createElement('li');
    el.textContent = (p.id === oradorId ? '🎤 ' : '') + p.nombre + (p.id === miId ? ' (tú)' : '');
    if (p.id === miId) el.classList.add('yo');
    if (p.id === oradorId) el.classList.add('habla');
    return el;
  }

  let ultimoRender = '';
  function render() {
    const t = Date.now();
    for (const [id, p] of gente) if (id !== miId && t - p.visto > EXPIRA_MS) gente.delete(id);
    const lista = [...gente.values()].sort((a, b) => a.nombre.localeCompare(b.nombre));
    const o = oradorActivo();
    const firma = JSON.stringify([lista.map((p) => [p.id, p.nombre, p.lado]), o && o.id, o && o.lado, miLado, conectado]);
    if (firma === ultimoRender) return;
    ultimoRender = firma;

    document.querySelectorAll('.lado').forEach((b) => b.classList.toggle('activo', miLado === b.dataset.lado));
    const oId = o ? o.id : null;
    const fav = lista.filter((p) => p.lado === 'favor');
    const con = lista.filter((p) => p.lado === 'contra');
    const sin = lista.filter((p) => !p.lado);
    $('nF').textContent = fav.length; $('nC').textContent = con.length;
    $('lF').replaceChildren(...fav.map((p) => li(p, oId)));
    $('lC').replaceChildren(...con.map((p) => li(p, oId)));
    const tot = fav.length + con.length;
    $('mF').style.width = (tot ? (fav.length / tot) * 100 : 50) + '%';
    $('mC').style.width = (tot ? (con.length / tot) * 100 : 50) + '%';
    $('sinLado').textContent = sin.length ? `Sin elegir aún (${sin.length}): ` + sin.map((p) => p.nombre).join(', ') : '';

    $('orador').className = 'card orador ' + (o ? o.lado : 'libre');
    if (o) {
      const soyYo = o.id === miId;
      $('oEtq').textContent = soyYo ? '¡Tienes la palabra!' : 'Tiene la palabra · ' + (o.lado === 'favor' ? 'A favor' : 'En contra');
      $('oNombre').textContent = '🎤 ' + o.nombre;
      $('oReloj').classList.remove('hidden');
      $('mano').disabled = true;
      $('mano').textContent = soyYo ? '🎤 Estás hablando' : '⏳ Espera tu turno';
      $('ceder').classList.toggle('hidden', !soyYo);
    } else {
      $('oEtq').textContent = 'Nadie tiene la palabra';
      $('oNombre').textContent = '✋ La palabra está libre';
      $('oReloj').classList.add('hidden');
      $('mano').disabled = !miLado;
      $('mano').textContent = miLado ? '✋ Alzar la mano' : '✋ Elige tu postura para alzar la mano';
      $('ceder').classList.add('hidden');
    }
  }

  function tick() {
    const o = oradorActivo();
    if (o) {
      const r = Math.max(0, o.inicio + o.dur - ahora());
      $('oSeg').textContent = Math.min(20, Math.ceil(r / 1000));
      $('oBarra').style.width = Math.min(100, (r / o.dur) * 100) + '%';
    }
    render();
    requestAnimationFrame(tick);
  }

  setInterval(() => { if (conectado) anunciarme(); }, LATIDO_MS);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { if (conectado) anunciarme(); else if (cliente) cliente.reconnect(); }
  });

  if (typeof mqtt === 'undefined') { $('con').textContent = '🔴 No se pudo cargar la librería'; return; }
  conectar();
  requestAnimationFrame(tick);
  if (miNombre) mostrar('foro'); else { mostrar('ingreso'); $('nombre').focus(); }
})();
</script>
</body>
</html>
